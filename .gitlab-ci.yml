# "test" and "deploy" are part of GitLab's default stage list, so no explicit
# stages: block is needed here.
api-test:
    stage: test
    image: php:8.3-cli
    services:
        - name: postgres:15.2-alpine
          alias: db
    variables:
        APP_ENV: test
        POSTGRES_DB: warehouse-api
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: pass4ask09
        # Doctrine appends the "_test" suffix itself (see when@test in config/packages/doctrine.yaml),
        # so the suite actually runs against "warehouse-api_test".
        DATABASE_URL: "postgresql://postgres:pass4ask09@db:5432/warehouse-api?serverVersion=15&charset=utf8"
    before_script:
        - apt-get update && apt-get install -y libpq-dev libzip-dev libicu-dev git unzip
        - docker-php-ext-configure intl
        - docker-php-ext-install pdo_pgsql bcmath intl zip
        - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
        - composer install --no-interaction --no-progress
    script:
        # config/jwt/*.pem is gitignored, so the key pair has to be generated in CI.
        - bin/console ask:generate:jwtKeys
        - bin/console doctrine:database:create --if-not-exists --env=test
        - bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration --env=test
        - bin/console doctrine:fixtures:load --no-interaction --env=test
        - composer test:api

deploy-prod-job:
    stage: deploy
    needs:
        - api-test
    only:
        - master
    environment:
        name: production
    script:
        - eval $(ssh-agent -s)
        - echo "$DEPLOY_PRIVATE_SSH_KEY_PROD" | base64 -d | tr -d '\r' | ssh-add -
        - echo "Deploying the PROD project..."
        - ssh -tt -o StrictHostKeyChecking=no -p ${DEPLOY_PORT_PROD} ${DEPLOY_HOST_PROD} "
            cd ${DEPLOY_PATH_PROD}/root/sites/${PROJECT_NAME}/ &&
            git reset --hard &&
            git pull origin master &&
            docker compose down &&
            docker compose --env-file=.env.local up -d --build &&
            docker compose exec php composer install --no-scripts --optimize-autoloader &&
            docker compose exec php bin/console ask:deploy
            "
